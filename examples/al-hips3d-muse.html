<!doctype html>
<html>
    <head>
    </head>
<body>


<div id="aladin-lite-div" style="width: 768px; height: 512px"></div>
<script>let aladin; let hips;</script>
<script type="module">
    import A from '../src/js/A.js';
    A.init.then(() => {
        aladin = A.aladin(
            '#aladin-lite-div',
            {
                showSimbadPointerControl: true,
                projection: 'AIT', // set a projection
                fov: 2.0/60, // initial field of view in degrees
                target: '15 00 01.93 +01 53 31.2', // initial target
                cooFrame: 'icrs', // set galactic frame
                reticleColor: '#ff89ff', // change reticle color
                showContextMenu: true,
                showFrame: true,
                showZoomControl:true,
                showSettingsControl:true,
                fullScreen: true,
                samp: true,
            }
        );

        hips = aladin.newImageSurvey("https://alasky.cds.unistra.fr/HIPS3D/MUSE-test", {
            successCallback: () => {
                hips.setFrequency({value: 636.6e12, unit: "Hz"})
            }
        });
        aladin.setImageLayer(hips)
    });
</script>
<style>
    .aladin-cat-browser-box {
        width: 600px;
    }
</style>
</body>
</html>
